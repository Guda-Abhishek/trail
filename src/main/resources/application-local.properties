# Local-development profile ("local"). Activated only on a developer machine (SPRING_PROFILES_ACTIVE=local in the
# untracked .env), so deployed environments that do not activate it never get these settings.
#
# Expense currency conversion (FX) - DEVELOPMENT ASSUMPTIONS, NOT an approved production financial policy.
# Finance has not approved a rate source, rate-date basis, scale or rounding mode for production; these values
# exist so cross-currency expense acquisition can be exercised locally against rates placed in the
# currency_exchange_rate table. Do not copy them to a production profile without Finance approval.
#
#   provider        database     use the existing Finance-maintained currency_exchange_rate table
#   scale           2            decimals kept on the converted amount (billed amount column is DECIMAL(19,2))
#   rounding-mode   HALF_UP      java.math.RoundingMode
#   rate-date-basis EXPENSE_DATE the rate is looked up for the expense's own date (exact date, NO fallback to
#                                another date - an expense dated 2026-10-08 needs a rate effective 2026-10-08)
#
# Missing or invalid values still stop the application at startup (ExpenseFxConfigurationValidator), and a
# cross-currency expense with no rate for its exact date is rejected, so nothing is ever converted silently.
ar.expense-fx.provider=database
ar.expense-fx.scale=2
ar.expense-fx.rounding-mode=HALF_UP
ar.expense-fx.rate-date-basis=EXPENSE_DATE
