# ===============================
# APPLICATION
# ===============================
spring.application.name=AccountsReceivableService
spring.task.scheduling.enabled=true

# ===============================
# DATASOURCE (AR Database - Aiven)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# JACKSON
# ===============================
# Serialize LocalDate / LocalDateTime as ISO strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# ===============================
# SERVER
# ===============================
server.port=8080
server.servlet.context-path=/paves/ar

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ===============================
# EXTERNAL SERVICES
# ===============================
tms.api.base-url=${TMS_API_BASE_URL}

# Expense Management (XMS) - read-only expense acquisition. Disabled by default;
# no URL or secret is hardcoded. Auth: the incoming request's Authorization header is
# forwarded unchanged to XMS (same as TMS).
xms.api.enabled=${XMS_ENABLED:false}
xms.api.base-url=${EXPENSE_MANAGEMENT_URL:}
xms.api.connect-timeout-ms=${XMS_CONNECT_TIMEOUT_MS:5000}
xms.api.read-timeout-ms=${XMS_READ_TIMEOUT_MS:15000}
xms.api.page-size=${XMS_PAGE_SIZE:100}
xms.api.first-page-index=${XMS_FIRST_PAGE_INDEX:0}
xms.api.max-pages=${XMS_MAX_PAGES:100}
xms.api.max-line-items=${XMS_MAX_LINE_ITEMS:1000}
xms.api.base-currency=${XMS_BASE_CURRENCY:}
xms.api.retry-max-attempts=${XMS_RETRY_MAX_ATTEMPTS:3}
xms.api.retry-backoff-ms=${XMS_RETRY_BACKOFF_MS:500}

# ===============================
# SECURITY (UMS JWT)
# Spring Boot builds the JwtDecoder from the issuer (same as RMS).
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}

# ===============================
# MAIL (Gmail SMTP - Invoice delivery)
# Credentials come from environment variables only - see .env.example.
# MAIL_USERNAME/MAIL_PASSWORD must never be committed.
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.com.AccountReceivableManagement=DEBUG
logging.level.io.debezium=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.apache.kafka.connect=WARN



# ===============================
# CLIENT CDC (RMS -> AR)
# ===============================

client-cdc.enabled=true




# Connector
client-cdc.connector-name=RMS
client-cdc.connector-class=io.debezium.connector.mysql.MySqlConnector

# Source Database (RMS RDS)
client-cdc.database-type=mysql
client-cdc.hostname=${RMS_DB_HOST}
client-cdc.port=${RMS_DB_PORT}
client-cdc.database-name=${RMS_DB_NAME}
client-cdc.username=${RMS_DB_USERNAME}
client-cdc.password=${RMS_DB_PASSWORD}

client-cdc.jdbc-url=jdbc:mysql://${RMS_DB_HOST}:${RMS_DB_PORT}/${RMS_DB_NAME}?connectionTimeZone=UTC

# Debezium
client-cdc.server-name=rms_mysql
client-cdc.server-id=85744
client-cdc.topic-prefix=client-cdc

# Monitor only the RMS database
client-cdc.database-include-list=rms

# Monitor only the client table
client-cdc.table-include-list=rms.client

# Snapshot
client-cdc.snapshot-mode=when_needed

# Storage
client-cdc.offset-table=debezium_client_offsets
client-cdc.schema-history-table=debezium_client_schema_history

# SSL
client-cdc.ssl.mode=REQUIRED

# ===============================
# PROJECT CDC (PMS -> AR)
# ===============================

project-cdc.enabled=true

# Connector
project-cdc.connector-name=PMS
project-cdc.connector-class=io.debezium.connector.mysql.MySqlConnector

# Source Database (PMS RDS - Shared Dev RDS)
project-cdc.database-type=mysql
project-cdc.hostname=${PMS_DB_HOST}
project-cdc.port=${PMS_DB_PORT}
project-cdc.database-name=${PMS_DB_NAME}
project-cdc.username=${PMS_DB_USERNAME}
project-cdc.password=${PMS_DB_PASSWORD}

project-cdc.jdbc-url=jdbc:mysql://${PMS_DB_HOST}:${PMS_DB_PORT}/${PMS_DB_NAME}?connectionTimeZone=UTC
# Debezium
project-cdc.server-name=pms_mysql
project-cdc.server-id=85745
project-cdc.topic-prefix=project-cdc

# Monitor only the PMS database
project-cdc.database-include-list=pms

# Monitor only the project table
project-cdc.table-include-list=pms.projects

# Snapshot
project-cdc.snapshot-mode=when_needed

# Storage
project-cdc.offset-table=debezium_project_offsets
project-cdc.schema-history-table=debezium_project_schema_history

# SSL
project-cdc.ssl.mode=REQUIRED

# ===============================
# Authorized signatory signature (Company Profile)
# ===============================
app.signature.max-bytes=${SIGNATURE_MAX_BYTES:1048576}
app.signature.max-dimension-px=${SIGNATURE_MAX_DIMENSION_PX:4000}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# JWT verification for the signature-management endpoints (FINANCE_EXECUTIVE only).
# No key, algorithm or claim name is defined in this repository, so none is defaulted:
# until these are set the endpoints answer 503 and nothing can be uploaded or removed.
app.security.jwt.algorithm=${AUTH_JWT_ALGORITHM:}
app.security.jwt.secret=${AUTH_JWT_SECRET:}
app.security.jwt.secret-encoding=${AUTH_JWT_SECRET_ENCODING:UTF8}
app.security.jwt.public-key-pem=${AUTH_JWT_PUBLIC_KEY_PEM:}
app.security.jwt.issuer=${AUTH_JWT_ISSUER:}
app.security.jwt.audience=${AUTH_JWT_AUDIENCE:}
app.security.jwt.roles-claim=${AUTH_JWT_ROLES_CLAIM:}
app.security.jwt.required-role=${AUTH_JWT_REQUIRED_ROLE:FINANCE_EXECUTIVE}

# Expense currency conversion (FX). NOT enabled by default: a cross-currency XMS expense is rejected
# (fail-closed) until Finance has approved the rate source and policy and approved rates are loaded into
# currency_exchange_rate through the approved process. Do not enable these without that approval.
# Enabling the database provider requires ALL of the settings below (startup fails otherwise):
# ar.expense-fx.provider=database
# ar.expense-fx.scale=<0..2 - decimals of the converted amount>
# ar.expense-fx.rounding-mode=<a java.math.RoundingMode name, e.g. HALF_UP>
# ar.expense-fx.rate-date-basis=<EXPENSE_DATE | BILLING_PERIOD_END>
